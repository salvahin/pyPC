# Test Program Configuration for pyPC Testing Framework
# Defines available test programs and their characteristics

test_programs:
  # Sorting algorithms
  bubble_sort:
    path: "test_programs/bubble_sort.py"
    function: "bubbleSort"
    dimensions: 4
    category: "sorting"
    description: "Bubble sort implementation with 4 inputs"
    complexity: "medium"
    expected_coverage: 1.0
    bounds:
      lower: -999999
      upper: 999999
    
  three_number_sort:
    path: "test_programs/three_number_sort.py"
    function: "sort_three"
    dimensions: 3
    category: "sorting"
    description: "Sort three numbers"
    complexity: "low"
    expected_coverage: 1.0
    bounds:
      lower: -999999
      upper: 999999
    
  # Mathematical functions
  minimum:
    path: "test_programs/minimum.py"
    function: "find_min"
    dimensions: 4
    category: "mathematical"
    description: "Find minimum of 4 numbers"
    complexity: "low"
    expected_coverage: 1.0
    bounds:
      lower: -999999
      upper: 999999
    
  trig_area:
    path: "test_programs/trig_area.py"
    function: "triangle_area"
    dimensions: 3
    category: "mathematical"
    description: "Calculate triangle area from sides"
    complexity: "medium"
    expected_coverage: 0.8  # Has complex conditions
    bounds:
      lower: -999999
      upper: 999999
    notes: "Contains complex conditional logic for triangle validity"
    
  # Game functions - single function testing
  rock_paper_scissor_player_choice:
    path: "test_programs/test_game_programs/function_only_testings/rock_paper_scissor_player_choice.py"
    function: "player_choice"
    dimensions: 1
    category: "game"
    description: "Rock-paper-scissors player choice validation"
    complexity: "low"
    expected_coverage: 1.0
    bounds:
      lower: 0
      upper: 10
    
  bounce_draw:
    path: "test_programs/test_game_programs/function_only_testings/bounce_draw.py"
    function: "draw"
    dimensions: 2
    category: "game"
    description: "Bounce game drawing function"
    complexity: "low"
    expected_coverage: 1.0
    bounds:
      lower: -1000
      upper: 1000
    
  guess_the_number_input_guess:
    path: "test_programs/test_game_programs/function_only_testings/guess_the_number_input_guess.py"
    function: "input_guess"
    dimensions: 1
    category: "game"
    description: "Number guessing game input validation"
    complexity: "low"
    expected_coverage: 0.75
    bounds:
      lower: 0
      upper: 100
    
  jogo_da_velha_python_actualizar_jogadas:
    path: "test_programs/test_game_programs/function_only_testings/jogo_da_velha_python_actualizar_jogadas.py"
    function: "actualizar_jogadas"
    dimensions: 1
    category: "game"
    description: "Tic-tac-toe move update function"
    complexity: "medium"
    expected_coverage: 0.9
    bounds:
      lower: 0
      upper: 9
    
  rock_paper_scissor_number_to_name:
    path: "test_programs/test_game_programs/function_only_testings/rock_paper_scissor_number_to_name.py"
    function: "number_to_name"
    dimensions: 1
    category: "game"
    description: "Convert number to rock/paper/scissors"
    complexity: "low"
    expected_coverage: 1.0
    bounds:
      lower: 0
      upper: 5
    
  TRPG_character_create_character:
    path: "test_programs/test_game_programs/function_only_testings/TRPG_character_create_character.py"
    function: "create_character"
    dimensions: 1
    category: "game"
    description: "RPG character creation function"
    complexity: "medium"
    expected_coverage: 1.0
    bounds:
      lower: 0
      upper: 100
      
  # New complex test programs with deeper branching
  complex_conditions:
    path: "test_programs/complex_conditions.py"
    function: "complex_conditions"
    dimensions: 4
    category: "complex"
    description: "Deep nested conditionals with multiple paths"
    complexity: "hard"
    expected_coverage: 0.3  # Much harder to achieve full coverage
    bounds:
      lower: -100
      upper: 100
    notes: "Designed to demonstrate multi-objective trade-offs"
    
  deep_branching:
    path: "test_programs/deep_branching.py"
    function: "deep_branching"
    dimensions: 4
    category: "complex"
    description: "Multi-level branching with path-dependent execution"
    complexity: "hard"
    expected_coverage: 0.4
    bounds:
      lower: -50
      upper: 50
    notes: "4 levels of nested conditions with state accumulation"
    
  nested_loops:
    path: "test_programs/nested_loops.py"
    function: "nested_loops"
    dimensions: 4
    category: "complex"
    description: "Nested loops with conditional branches"
    complexity: "hard"
    expected_coverage: 0.35
    bounds:
      lower: -20
      upper: 20
    notes: "Combines iteration with branching for complexity"

# Test suites - groups of related test programs
test_suites:
  basic:
    name: "Basic Test Suite"
    description: "Simple functions for quick testing"
    programs:
      - "minimum"
      - "three_number_sort"
      
  sorting:
    name: "Sorting Algorithms"
    description: "All sorting-related test programs"
    programs:
      - "bubble_sort"
      - "three_number_sort"
      
  mathematical:
    name: "Mathematical Functions"
    description: "Mathematical computation tests"
    programs:
      - "minimum"
      - "trig_area"
      
  games:
    name: "Game Functions"
    description: "Game-related function tests"
    programs:
      - "rock_paper_scissor_player_choice"
      - "bounce_draw"
      - "guess_the_number_input_guess"
      - "jogo_da_velha_python_actualizar_jogadas"
      - "rock_paper_scissor_number_to_name"
      - "TRPG_character_create_character"
      
  complex:
    name: "Complex Functions"
    description: "Functions with complex control flow"
    programs:
      - "bubble_sort"
      - "trig_area"
      - "jogo_da_velha_python_actualizar_jogadas"
      
  deep_complex:
    name: "Deep Complex Programs"
    description: "Programs with deep branching for MO trade-off testing"
    programs:
      - "complex_conditions"
      - "deep_branching"
      - "nested_loops"
      
  all:
    name: "Complete Test Suite"
    description: "All available test programs"
    programs:
      - "bubble_sort"
      - "three_number_sort"
      - "minimum"
      - "trig_area"
      - "rock_paper_scissor_player_choice"
      - "bounce_draw"
      - "guess_the_number_input_guess"
      - "jogo_da_velha_python_actualizar_jogadas"
      - "rock_paper_scissor_number_to_name"
      - "TRPG_character_create_character"
      - "complex_conditions"
      - "deep_branching"
      - "nested_loops"

# Difficulty levels for progressive testing
difficulty_levels:
  easy:
    description: "Simple programs with linear flow"
    max_dimensions: 2
    max_branches: 3
    programs:
      - "minimum"
      - "three_number_sort"
      - "rock_paper_scissor_player_choice"
      - "rock_paper_scissor_number_to_name"
      
  medium:
    description: "Moderate complexity with some branching"
    max_dimensions: 4
    max_branches: 10
    programs:
      - "bubble_sort"
      - "bounce_draw"
      - "guess_the_number_input_guess"
      - "TRPG_character_create_character"
      
  hard:
    description: "Complex programs with nested conditions"
    max_dimensions: 4
    max_branches: 20
    programs:
      - "trig_area"
      - "jogo_da_velha_python_actualizar_jogadas"

# New challenging test programs
  advanced_datastructure:
    path: "test_programs/advanced_datastructure.py"
    function: "advanced_datastructure"
    dimensions: 4
    category: "challenging"
    description: "Complex nested data structure operations"
    complexity: "very_hard"
    expected_coverage: 0.20
    bounds:
      lower: -20
      upper: 20
    notes: "Nested dictionaries with state-dependent access"
    
  pattern_matcher:
    path: "test_programs/pattern_matcher.py"
    function: "pattern_matcher"
    dimensions: 4
    category: "challenging"
    description: "Pattern matching with backtracking"
    complexity: "very_hard"
    expected_coverage: 0.25
    bounds:
      lower: -10
      upper: 10
    notes: "Multiple matching strategies and backtracking"
    
  constraint_solver:
    path: "test_programs/constraint_solver.py"
    function: "constraint_solver"
    dimensions: 4
    category: "challenging"
    description: "Constraint satisfaction with conflict detection"
    complexity: "very_hard"
    expected_coverage: 0.15
    bounds:
      lower: -15
      upper: 15
    notes: "Constraint propagation and backtracking"
    
  graph_traversal:
    path: "test_programs/graph_traversal.py"
    function: "graph_traversal"
    dimensions: 4
    category: "challenging"
    description: "Dynamic graph construction and traversal"
    complexity: "very_hard"
    expected_coverage: 0.20
    bounds:
      lower: -10
      upper: 10
    notes: "DFS/BFS/Bidirectional search with cycle detection"

# Benchmark configurations
benchmarks:
  standard:
    description: "Standard benchmark for algorithm comparison"
    programs: ["minimum", "bubble_sort", "trig_area"]
    target_coverage: 0.95
    max_evaluations: 10000
    
  quick:
    description: "Quick benchmark for rapid testing"
    programs: ["minimum", "three_number_sort"]
    target_coverage: 1.0
    max_evaluations: 1000
    
  comprehensive:
    description: "Comprehensive benchmark using all programs"
    programs: "all"
    target_coverage: 0.9
    max_evaluations: 50000
    
  challenging_benchmark:
    description: "Complete benchmark suite with all difficulty levels"
    programs: ["minimum", "three_number_sort", "bubble_sort", "trig_area",
              "complex_conditions", "deep_branching", "advanced_datastructure",
              "pattern_matcher", "constraint_solver", "graph_traversal"]
    target_coverage: 0.5
    max_evaluations: 100000