# Experiment Configuration for pyPC Testing Framework
# Define experimental setups for batch runs

# Global experiment settings
global_settings:
  random_seeds: [42, 123, 456, 789, 1011]  # Seeds for reproducibility
  max_generations: 100
  population_size: 100
  verbose: false
  save_convergence: true
  save_final_population: false
  
# Termination criteria
termination:
  max_generations: 100
  max_evaluations: 10000
  target_fitness: 0.01
  stagnation_generations: 20
  time_limit: 300  # seconds

# Experiment definitions
experiments:
  quick_test:
    name: "Quick Test Run"
    description: "Fast test to verify setup"
    algorithms: ["PSO", "GA"]
    test_programs: ["minimum", "three_number_sort"]
    repetitions: 2
    settings:
      max_generations: 10
      population_size: 20
      
  full_comparison:
    name: "Full Algorithm Comparison"
    description: "Complete comparison of all algorithms on all test programs"
    algorithms: "preset:comprehensive"
    test_programs: "all"
    repetitions: 30
    settings:
      max_generations: 100
      population_size: 100
      
  parameter_sensitivity:
    name: "Parameter Sensitivity Analysis"
    description: "Test different parameter settings for key algorithms"
    algorithms:
      PSO:
        - {w: 0.4, c1: 2.0, c2: 2.0}
        - {w: 0.7, c1: 2.0, c2: 2.0}
        - {w: 0.9, c1: 2.0, c2: 2.0}
      GA:
        - {pop_size: 50}
        - {pop_size: 100}
        - {pop_size: 200}
      DE:
        - {CR: 0.3, F: 0.5}
        - {CR: 0.7, F: 0.5}
        - {CR: 0.9, F: 0.8}
    test_programs: ["bubble_sort", "trig_area"]
    repetitions: 10
    
  convergence_study:
    name: "Convergence Analysis"
    description: "Detailed convergence behavior study"
    algorithms: ["PSO", "GA", "DE", "CMAES"]
    test_programs: ["minimum", "bubble_sort", "trig_area"]
    repetitions: 20
    settings:
      max_generations: 200
      save_convergence: true
      convergence_interval: 1  # Save every generation
      
  scalability_test:
    name: "Scalability Analysis"
    description: "Test performance with different population sizes"
    algorithms: ["PSO", "GA", "DE"]
    test_programs: ["bubble_sort"]
    repetitions: 10
    population_sizes: [20, 50, 100, 200, 500]
    
  game_functions_test:
    name: "Game Functions Test"
    description: "Test on game-related functions"
    algorithms: ["PSO", "GA", "DE", "NelderMead"]
    test_programs: 
      - "rock_paper_scissor_player_choice"
      - "bounce_draw"
      - "guess_the_number_input_guess"
      - "jogo_da_velha_python_actualizar_jogadas"
      - "rock_paper_scissor_number_to_name"
      - "TRPG_character_create_character"
    repetitions: 15
    
  statistical_validation:
    name: "Statistical Validation"
    description: "Experiment for statistical significance testing"
    algorithms: ["PSO", "GA", "DE", "ES", "CMAES"]
    test_programs: "all"
    repetitions: 50  # High repetitions for statistical validity
    settings:
      save_all_results: true
      compute_statistics: true
      
# Batch experiment configurations
batch_runs:
  nightly:
    description: "Nightly comprehensive test"
    experiments: ["full_comparison", "convergence_study"]
    parallel: true
    max_workers: 4
    
  weekend:
    description: "Weekend extensive analysis"
    experiments: ["full_comparison", "parameter_sensitivity", "scalability_test", "statistical_validation"]
    parallel: true
    max_workers: 8
    
  paper_results:
    description: "Generate results for academic paper"
    experiments: ["statistical_validation", "convergence_study", "parameter_sensitivity"]
    parallel: true
    max_workers: 4
    generate_report: true
    report_format: "latex"

# Output configuration
output:
  base_directory: "results"
  timestamp_format: "%Y%m%d_%H%M%S"
  create_subdirectories: true
  structure:
    - "experiments/{experiment_name}"
    - "algorithms/{algorithm_name}"
    - "test_programs/{program_name}"
  
  files:
    summary: "summary.json"
    raw_data: "raw_results.csv"
    statistics: "statistics.csv"
    convergence: "convergence_data.csv"
    plots: "plots/"
    logs: "logs/"
    
# Plotting configuration
plotting:
  enabled: true
  formats: ["png", "pdf"]
  dpi: 300
  style: "seaborn"
  
  plots:
    - type: "convergence"
      title: "Convergence Curves"
      xlabel: "Generation"
      ylabel: "Best Fitness"
      log_scale: false
      
    - type: "boxplot"
      title: "Algorithm Performance Comparison"
      xlabel: "Algorithm"
      ylabel: "Final Fitness"
      
    - type: "heatmap"
      title: "Algorithm vs Problem Performance"
      colormap: "viridis"
      
    - type: "statistical"
      title: "Statistical Significance Matrix"
      test: "wilcoxon"
      alpha: 0.05