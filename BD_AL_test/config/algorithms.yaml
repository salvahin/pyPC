# Algorithm Configurations for pyPC Testing Framework
# Each algorithm can have default parameters that can be overridden in experiments

algorithms:
  # Swarm Intelligence Algorithms
  PSO:
    name: "Particle Swarm Optimization"
    type: "swarm"
    enabled: true
    default_params:
      pop_size: 100
      w: 0.7  # inertia weight
      c1: 2.0  # cognitive parameter
      c2: 2.0  # social parameter
    variants:
      standard:
        w: 0.7
        c1: 2.0
        c2: 2.0
      aggressive:
        w: 0.9
        c1: 2.5
        c2: 1.5
      conservative:
        w: 0.4
        c1: 1.5
        c2: 2.5

  # Evolutionary Algorithms
  GA:
    name: "Genetic Algorithm"
    type: "evolutionary"
    enabled: true
    default_params:
      pop_size: 100
      eliminate_duplicates: true
      n_offsprings: null  # will be set to pop_size if null
    variants:
      standard:
        pop_size: 100
      large_pop:
        pop_size: 200
      small_pop:
        pop_size: 50

  DE:
    name: "Differential Evolution"
    type: "evolutionary"
    enabled: true
    default_params:
      pop_size: 100
      variant: "DE/rand/1/bin"
      CR: 0.7  # crossover probability
      F: 0.5   # differential weight
      dither: "vector"
      jitter: false
    variants:
      best1bin:
        variant: "DE/best/1/bin"
        CR: 0.9
        F: 0.8
      rand2bin:
        variant: "DE/rand/2/bin"
        CR: 0.5
        F: 0.5
      currenttobest:
        variant: "DE/current-to-best/1/bin"
        CR: 0.8
        F: 0.6

  ES:
    name: "Evolution Strategy"
    type: "evolutionary"
    enabled: true
    default_params:
      n_offsprings: 200
      rule: 0.142857  # 1/7 rule
      gamma: 0.85
      alpha: 0.2

  G3PCX:
    name: "Generalized Generation Gap with PCX"
    type: "evolutionary"
    enabled: true
    default_params:
      pop_size: 100
      n_offsprings: 2
      n_parents: 3

  BRKGA:
    name: "Biased Random Key Genetic Algorithm"
    type: "evolutionary"
    enabled: true
    default_params:
      n_elites: 20
      n_offsprings: 70
      n_mutants: 10
      bias: 0.7

  # Gradient-Free Optimization
  NelderMead:
    name: "Nelder-Mead Simplex"
    type: "gradient_free"
    enabled: true
    default_params:
      alpha: 1.0   # reflection
      beta: 2.0    # expansion
      gamma: 0.5   # contraction
      delta: 0.05  # shrinking
    notes: "Good for low-dimensional problems"

  PatternSearch:
    name: "Pattern Search"
    type: "gradient_free"
    enabled: true
    default_params:
      rho: 0.5
      delta: 0.25
      explr_delta: 0.25

  CMAES:
    name: "Covariance Matrix Adaptation ES"
    type: "evolutionary"
    enabled: true
    default_params:
      sigma: 0.1
      restarts: 0
    requirements:
      min_dimensions: 2
    notes: "Requires at least 2 dimensions"

  # Constrained Optimization
  SRES:
    name: "Stochastic Ranking ES"
    type: "evolutionary"
    enabled: true
    default_params:
      n_offsprings: 200
      rule: 0.142857
      gamma: 0.85
      alpha: 0.2
    capabilities:
      constraints: true

  ISRES:
    name: "Improved SRES"
    type: "evolutionary"
    enabled: true
    default_params:
      n_offsprings: 200
      rule: 0.142857
      gamma: 0.85
      alpha: 0.2
    capabilities:
      constraints: true

# Multi-Objective Algorithms
  NSGA2:
    name: "Non-dominated Sorting Genetic Algorithm II"
    type: "multi_objective"
    enabled: true
    default_params:
      pop_size: 100
      eliminate_duplicates: true
      n_offsprings: null
    description: "Classic multi-objective EA with non-dominated sorting"
    reference: "Deb et al., 2002"
    
  NSGA3:
    name: "Non-dominated Sorting Genetic Algorithm III"
    type: "multi_objective"
    enabled: true
    default_params:
      pop_size: 100
      eliminate_duplicates: true
      ref_dirs: null  # Auto-generated based on n_obj
    description: "Many-objective optimization with reference directions"
    reference: "Deb & Jain, 2014"
    
  MOEAD:
    name: "Multi-Objective Evolutionary Algorithm based on Decomposition"
    type: "multi_objective"
    enabled: true
    default_params:
      n_neighbors: 20
      decomposition: "auto"
      prob_neighbor_mating: 0.9
      ref_dirs: null  # Auto-generated
    description: "Decomposition-based approach for multi-objective optimization"
    reference: "Zhang & Li, 2007"
    
  CTAEA:
    name: "Constrained Two-Archive Evolutionary Algorithm"
    type: "multi_objective"
    enabled: true
    default_params:
      pop_size: 100
      ref_dirs: null  # Auto-generated
      eliminate_duplicates: true
    description: "Two-archive algorithm for constrained multi-objective problems"
    reference: "Li et al., 2019"

# Algorithm selection presets for different problem types
presets:
  fast:
    description: "Quick algorithms for rapid testing"
    algorithms: ["PSO", "GA", "NelderMead"]
    
  comprehensive:
    description: "All single-objective algorithms"
    algorithms: ["PSO", "GA", "DE", "ES", "G3PCX", "BRKGA", "NelderMead", "PatternSearch", "CMAES", "SRES", "ISRES"]
    
  evolutionary_only:
    description: "Only evolutionary algorithms"
    algorithms: ["GA", "DE", "ES", "G3PCX", "BRKGA", "CMAES", "SRES", "ISRES"]
    
  swarm_and_gradient_free:
    description: "Swarm and gradient-free methods"
    algorithms: ["PSO", "NelderMead", "PatternSearch"]
    
  constrained:
    description: "Algorithms good for constrained problems"
    algorithms: ["SRES", "ISRES", "GA", "DE", "CTAEA"]
    
  paper_comparison:
    description: "Standard set for academic paper comparisons"
    algorithms: ["PSO", "GA", "DE", "CMAES", "NelderMead"]
    
  multi_objective:
    description: "Multi-objective optimization algorithms"
    algorithms: ["NSGA2", "NSGA3", "MOEAD", "CTAEA"]
    
  mo_comparison:
    description: "Standard MO algorithms for comparison"
    algorithms: ["NSGA2", "NSGA3", "MOEAD"]